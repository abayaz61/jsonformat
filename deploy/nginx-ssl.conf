server {
    listen 80;
    listen [::]:80;
    server_name jsonformat.info www.jsonformat.info;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jsonformat.info www.jsonformat.info;
    root /var/www/json-formatter;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/jsonformat.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jsonformat.info/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /sitemap.xml {
        types { } default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8" always;
        try_files /sitemap.xml =404;
    }

    location = /sitemap.xml/ {
        return 301 /sitemap.xml;
    }

    location = /robots.txt {
        types { } default_type text/plain;
        try_files /robots.txt =404;
    }

    location = /robots.txt/ {
        return 301 /robots.txt;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}